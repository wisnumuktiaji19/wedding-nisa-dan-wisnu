<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Budgeting — Wisnu & Nisa</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #f6f3ef;

  color: #333;

}

.container {

  max-width: 600px;

  margin: auto;

  padding: 20px;

}

.header {

  background: #fff;

  border-radius: 20px;

  padding: 25px;

  margin-bottom: 15px;

  box-shadow: 0 4px 15px rgba(0,0,0,.06);

}

.header h1 {

  margin: 0;

  font-size: 25px;

}

.header p {

  margin: 7px 0 0;

  color: #777;

}

.cards {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;

}

.card {

  background: white;

  padding: 18px;

  border-radius: 16px;

  box-shadow: 0 4px 15px rgba(0,0,0,.05);

}

.card small {

  color: #888;

}

.card h2 {

  margin: 8px 0 0;

  font-size: 20px;

}

.section {

  background: white;

  margin-top: 15px;

  padding: 20px;

  border-radius: 18px;

  box-shadow: 0 4px 15px rgba(0,0,0,.05);

}

.section h3 {

  margin-top: 0;

}

input, select {

  width: 100%;

  padding: 12px;

  margin: 6px 0;

  border: 1px solid #ddd;

  border-radius: 10px;

  font-size: 15px;

}

button {

  width: 100%;

  padding: 13px;

  border: 0;

  border-radius: 10px;

  background: #333;

  color: white;

  font-size: 15px;

  margin-top: 8px;

}

.item {

  display: flex;

  justify-content: space-between;

  align-items: center;

  border-bottom: 1px solid #eee;

  padding: 12px 0;

}

.item:last-child {

  border-bottom: none;

}

.item-name {

  font-weight: bold;

}

.item-price {

  color: #666;

  font-size: 14px;

}

.delete {

  width: auto;

  background: #eee;

  color: #555;

  padding: 7px 10px;

  margin: 0 0 0 8px;

}

.progress {

  height: 10px;

  background: #eee;

  border-radius: 10px;

  overflow: hidden;

  margin-top: 12px;

}

.progress-bar {

  height: 100%;

  width: 0%;

  background: #555;

}

.footer {

  text-align: center;

  color: #999;

  padding: 25px 0;

  font-size: 13px;

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>Wisnu & Nisa 💍</h1>

    <p>Wedding Budgeting</p>

  </div>

  <div class="cards">

    <div class="card">

      <small>Total Budget</small>

      <h2 id="budget">Rp0</h2>

    </div>

    <div class="card">

      <small>Total Terpakai</small>

      <h2 id="spent">Rp0</h2>

    </div>

    <div class="card">

      <small>Sisa Budget</small>

      <h2 id="remaining">Rp0</h2>

    </div>

    <div class="card">

      <small>Progress</small>

      <h2 id="percentage">0%</h2>

    </div>

  </div>

  <div class="section">

    <h3>💰 Budget Pernikahan</h3>

    <input

      type="number"

      id="budgetInput"

      placeholder="Contoh: 50000000"

    >

    <button onclick="saveBudget()">

      Simpan Budget

    </button>

    <div class="progress">

      <div class="progress-bar" id="progressBar"></div>

    </div>

  </div>

  <div class="section">

    <h3>📋 Tambah Pengeluaran</h3>

    <input

      type="text"

      id="nameInput"

      placeholder="Contoh: Gedung / Catering / Cincin"

    >

    <input

      type="number"

      id="priceInput"

      placeholder="Nominal"

    >

    <button onclick="addExpense()">

      + Tambah Pengeluaran

    </button>

  </div>

  <div class="section">

    <h3>🧾 Daftar Pengeluaran</h3>

    <div id="expenseList">

      Belum ada pengeluaran.

    </div>

  </div>

  <div class="footer">

    Wedding preparation • Wisnu & Nisa

  </div>

</div>

<script>

let budget = Number(localStorage.getItem("weddingBudget")) || 0;

let expenses =

  JSON.parse(localStorage.getItem("weddingExpenses")) || [];

function formatRupiah(number) {

  return new Intl.NumberFormat("id-ID", {

    style: "currency",

    currency: "IDR",

    maximumFractionDigits: 0

  }).format(number);

}

function saveBudget() {

  const value =

    Number(document.getElementById("budgetInput").value);

  if (!value) {

    alert("Masukkan budget terlebih dahulu.");

    return;

  }

  budget = value;

  localStorage.setItem(

    "weddingBudget",

    budget

  );

  update();

}

function addExpense() {

  const name =

    document.getElementById("nameInput").value;

  const price =

    Number(document.getElementById("priceInput").value);

  if (!name || !price) {

    alert("Isi nama dan nominal terlebih dahulu.");

    return;

  }

  expenses.push({

    name: name,

    price: price

  });

  localStorage.setItem(

    "weddingExpenses",

    JSON.stringify(expenses)

  );

  document.getElementById("nameInput").value = "";

  document.getElementById("priceInput").value = "";

  update();

}

function deleteExpense(index) {

  expenses.splice(index, 1);

  localStorage.setItem(

    "weddingExpenses",

    JSON.stringify(expenses)

  );

  update();

}

function update() {

  let spent = expenses.reduce(

    (total, item) => total + item.price,

    0

  );

  let remaining = budget - spent;

  let percentage =

    budget > 0

    ? Math.round((spent / budget) * 100)

    : 0;

  document.getElementById("budget").innerText =

    formatRupiah(budget);

  document.getElementById("spent").innerText =

    formatRupiah(spent);

  document.getElementById("remaining").innerText =

    formatRupiah(remaining);

  document.getElementById("percentage").innerText =

    percentage + "%";

  document.getElementById("progressBar").style.width =

    Math.min(percentage, 100) + "%";

  const list =

    document.getElementById("expenseList");

  if (expenses.length === 0) {

    list.innerHTML =

      "Belum ada pengeluaran.";

    return;

  }

  list.innerHTML =

    expenses.map((item, index) => `

      <div class="item">

        <div>

          <div class="item-name">

            ${item.name}

          </div>

          <div class="item-price">

            ${formatRupiah(item.price)}

          </div>

        </div>

        <button

          class="delete"

          onclick="deleteExpense(${index})"

        >

          Hapus

        </button>

      </div>

    `).join("");

}

update();

</script>

</body>

</html>
