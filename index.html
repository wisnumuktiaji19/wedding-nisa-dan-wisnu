<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wedding Budgeting — Wisnu & Nisa</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f5f5f5;

      margin: 0;

      padding: 20px;

    }

    .container {

      max-width: 600px;

      margin: auto;

    }

    h1 {

      text-align: center;

    }

    .card {

      background: white;

      padding: 18px;

      border-radius: 15px;

      margin-bottom: 15px;

      box-shadow: 0 3px 10px rgba(0,0,0,.08);

    }

    input, button {

      width: 100%;

      padding: 12px;

      margin-top: 8px;

      box-sizing: border-box;

      border-radius: 8px;

      border: 1px solid #ddd;

    }

    button {

      background: #222;

      color: white;

      cursor: pointer;

    }

    .expense {

      display: flex;

      justify-content: space-between;

      padding: 12px 0;

      border-bottom: 1px solid #eee;

    }

    .logout {

      background: #b00020;

    }

  </style>

</head>

<body>

<div class="container">

  <h1>Wisnu & Nisa 💍</h1>

  <p style="text-align:center;">Wedding Budgeting</p>

  <div id="loginBox" class="card">

    <h3>Login</h3>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="loginMessage"></p>

  </div>

  <div id="app" style="display:none;">

    <div class="card">

      <h3>Budget</h3>

      <input type="number" id="budget" placeholder="Total budget">

      <button onclick="saveBudget()">Simpan Budget</button>

    </div>

    <div class="card">

      <h3>Ringkasan</h3>

      <p>Total Budget: <b id="totalBudget">Rp0</b></p>

      <p>Total Terpakai: <b id="totalUsed">Rp0</b></p>

      <p>Sisa Budget: <b id="remaining">Rp0</b></p>

    </div>

    <div class="card">

      <h3>Tambah Pengeluaran</h3>

      <input type="text" id="expenseName" placeholder="Contoh: Gedung">

      <input type="number" id="expenseAmount" placeholder="Jumlah">

      <button onclick="addExpense()">Tambah</button>

    </div>

    <div class="card">

      <h3>Daftar Pengeluaran</h3>

      <div id="expenseList"></div>

    </div>

    <button class="logout" onclick="logout()">Logout</button>

  </div>

</div>

<script>

  // ==============================

  // SUPABASE

  // ==============================

  const SUPABASE_URL = "https://igszkkrcbkpmnbqfqpzm.supabase.co";

  const SUPABASE_KEY = "sb_publishable_jnabjvVdmpdCie4C2bk7dA_WlhREBiG";

  const supabaseClient =

    window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_KEY

    );

  // ==============================

  // LOGIN

  // ==============================

  async function login() {

    const email =

      document.getElementById("email").value;

    const password =

      document.getElementById("password").value;

    const { error } =

      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });

    if (error) {

      document.getElementById("loginMessage").innerText =

        "Login gagal: " + error.message;

      return;

    }

    showApp();

    loadExpenses();

  }

  // ==============================

  // CEK LOGIN

  // ==============================

  async function checkLogin() {

    const { data } =

      await supabaseClient.auth.getSession();

    if (data.session) {

      showApp();

      loadExpenses();

    } else {

      document.getElementById("loginBox").style.display = "block";

      document.getElementById("app").style.display = "none";

    }

  }

  function showApp() {

    document.getElementById("loginBox").style.display = "none";

    document.getElementById("app").style.display = "block";

  }

  // ==============================

  // LOGOUT

  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

  }

  // ==============================

  // TAMBAH PENGELUARAN

  // ==============================

  async function addExpense() {

    const name =

      document.getElementById("expenseName").value;

    const amount =

      Number(document.getElementById("expenseAmount").value);

    const { data: { user } } =

      await supabaseClient.auth.getUser();

    if (!user) {

      alert("Silakan login dulu.");

      return;

    }

    const { error } =

      await supabaseClient

        .from("expenses")

        .insert({

          name: name,

          amount: amount,

          paid: false,

          user_id: user.id

        });

    if (error) {

      alert("Gagal menambah: " + error.message);

      return;

    }

    document.getElementById("expenseName").value = "";

    document.getElementById("expenseAmount").value = "";

    loadExpenses();

  }

  // ==============================

  // TAMPILKAN DATA

  // ==============================

  async function loadExpenses() {

    const { data: { user } } =

      await supabaseClient.auth.getUser();

    if (!user) return;

    const { data, error } =

      await supabaseClient

        .from("expenses")

        .select("*")

        .order("created_at", { ascending: false });

    if (error) {

      alert("Gagal mengambil data: " + error.message);

      return;

    }

    const list =

      document.getElementById("expenseList");

    list.innerHTML = "";

    let total = 0;

    data.forEach(item => {

      total += Number(item.amount);

      const div =

        document.createElement("div");

      div.className = "expense";

      div.innerHTML = `

        <span>

          ${item.name}<br>

          <b>Rp${Number(item.amount).toLocaleString("id-ID")}</b>

        </span>

        <button

          onclick="deleteExpense('${item.id}')"

          style="width:auto;background:#b00020;">

          Hapus

        </button>

      `;

      list.appendChild(div);

    });

    document.getElementById("totalUsed").innerText =

      "Rp" + total.toLocaleString("id-ID");

    const budget =

      Number(localStorage.getItem("budget") || 0);

    document.getElementById("totalBudget").innerText =

      "Rp" + budget.toLocaleString("id-ID");

    document.getElementById("remaining").innerText =

      "Rp" + (budget - total).toLocaleString("id-ID");

  }

  // ==============================

  // HAPUS

  // ==============================

  async function deleteExpense(id) {

    const { error } =

      await supabaseClient

        .from("expenses")

        .delete()

        .eq("id", id);

    if (error) {

      alert("Gagal menghapus: " + error.message);

      return;

    }

    loadExpenses();

  }

  // ==============================

  // BUDGET

  // ==============================

  async function saveBudget() {

  const budget =
    Number(document.getElementById("budget").value);

  const { data: { user } } =
    await supabaseClient.auth.getUser();

  if (!user) {
    alert("Silakan login dulu.");
    return;
  }

  const { data: existing } =
    await supabaseClient
      .from("wedding_settings")
      .select("id")
      .eq("user_id", user.id)
      .maybeSingle();

  let error;

  if (existing) {

    const result =
      await supabaseClient
        .from("wedding_settings")
        .update({ budget: budget })
        .eq("id", existing.id);

    error = result.error;

  } else {

    const result =
      await supabaseClient
        .from("wedding_settings")
        .insert({
          user_id: user.id,
          budget: budget
        });

    error = result.error;
  }

  if (error) {
    alert("Gagal menyimpan budget: " + error.message);
    return;
  }

  alert("Budget berhasil disimpan!");

  loadExpenses();
}
  }

  checkLogin();

</script>

</body>

</html>
